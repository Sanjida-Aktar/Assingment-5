    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title & logo -->
    <title>Github Issues Tracker </title>
    <link rel="stylesheet" href="assets/logo.png" type="image/x-icon"/>

    <!-- font Awesome cdn -->
<link  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css
">
     <!-- tailwind and deisi UI cdn -->
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>
<body class="w-11/12 mx-auto py-8 space-y-5">
    <!-- login section -->
     <section  class="w-full sm:w-8/12 lg:w-4/12 mx-auto py-8 space-y-5 bg-base-200 shadow-2xl rounded-lg ">
  <!-- Logo + Heading -->
  <div class="text-center">
    <div class="flex justify-center pb-5">
      <img src="assets/github-logo.png" alt="GitHub Logo" class="w-16 h-16" />
    </div>
    <h1 class="text-2xl font-bold">GitHub Issues Tracker</h1>
    <h3 class="text-xl text-gray-500">Sign in to manage your issues</h3>
  </div>

  <!-- Login Card -->
  <div class="card w-full max-w-sm mx-auto">
    <div class="card-body">
      <fieldset class="fieldset space-y-3">
        <label class="text-lg">Username</label>
        <input id="user-name" type="text" class="input input-bordered w-full" placeholder="Enter Username" />

        <label class="text-lg">Password</label>
        <input id="passward" type="password" class="input input-bordered w-full" placeholder="Password" />

        <button id="login-btn" class="btn btn-primary w-full mt-4">Login</button>
      </fieldset>
    </div>
  </div>
</section>

<div>
    <h2 class="text-lg font-bold">${info.title}</h2>
    </div>
    
<script src="./script/login.js"></script>
</body>
</html>
